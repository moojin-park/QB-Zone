<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Pass destination marker</title>
  <desc id="desc">Coral destination X with a readable crosshair.</desc>
  <defs>
    <linearGradient id="cyanMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fbff"/>
      <stop offset="0.35" stop-color="#1de6ef"/>
      <stop offset="1" stop-color="#0782b9"/>
    </linearGradient>
    <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5a1ff"/>
      <stop offset="0.45" stop-color="#7d4dff"/>
      <stop offset="1" stop-color="#39257f"/>
    </linearGradient>
    <linearGradient id="coralMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb09f"/>
      <stop offset="0.42" stop-color="#ff5f61"/>
      <stop offset="1" stop-color="#a51f45"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36527b"/>
      <stop offset="0.55" stop-color="#102548"/>
      <stop offset="1" stop-color="#071326"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1de6ef" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1de6ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#020713" flood-opacity="0.65"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="37" fill="#020713" fill-opacity="0.32" stroke="#ff5f61" stroke-width="4" stroke-dasharray="7 7"/>
  <circle cx="48" cy="48" r="23" fill="none" stroke="#ffc857" stroke-width="3" opacity="0.75"/>
  <path d="M25 25 L71 71 M71 25 L25 71" stroke="#020713" stroke-width="16" stroke-linecap="round"/>
  <path d="M25 25 L71 71 M71 25 L25 71" stroke="#ff5f61" stroke-width="9" stroke-linecap="round" filter="url(#neon)"/>
  <path d="M48 2 V13 M48 83 V94 M2 48 H13 M83 48 H94" stroke="#f7fcff" stroke-width="4" stroke-linecap="round"/>
</svg>
