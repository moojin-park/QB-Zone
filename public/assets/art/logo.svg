<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
  <title id="title">Pocket Vector logo</title>
  <desc id="desc">Neon arcade football wordmark with an original PV emblem.</desc>
  <defs>
    <linearGradient id="cyanMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fbff"/>
      <stop offset="0.35" stop-color="#1de6ef"/>
      <stop offset="1" stop-color="#0782b9"/>
    </linearGradient>
    <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5a1ff"/>
      <stop offset="0.45" stop-color="#7d4dff"/>
      <stop offset="1" stop-color="#39257f"/>
    </linearGradient>
    <linearGradient id="coralMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb09f"/>
      <stop offset="0.42" stop-color="#ff5f61"/>
      <stop offset="1" stop-color="#a51f45"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36527b"/>
      <stop offset="0.55" stop-color="#102548"/>
      <stop offset="1" stop-color="#071326"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1de6ef" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1de6ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#020713" flood-opacity="0.65"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="14" y="22" width="772" height="276" rx="56" fill="#020713" opacity="0.72"/>
  <path d="M83 83 Q163 19 245 69 Q297 101 311 159 Q327 219 273 268 Q212 313 126 274 Q53 241 44 169 Q36 113 83 83Z" fill="url(#violetMetal)" stroke="#1de6ef" stroke-width="12" filter="url(#shadow)"/>
  <path d="M111 230 L111 92 L180 92 Q246 92 246 151 Q246 211 177 211 L148 211 L148 230Z M148 127 L148 177 L177 177 Q205 177 205 151 Q205 127 177 127Z" fill="#f7fcff" stroke="#020713" stroke-width="7" fill-rule="evenodd"/>
  <path d="M186 93 L224 93 L252 194 L280 93 L320 93 L273 235 L230 235Z" fill="#ff5f61" stroke="#020713" stroke-width="7"/>
  <g filter="url(#neon)">
    <text x="351" y="144" font-family="Arial Black, Impact, sans-serif" font-size="70" letter-spacing="3" fill="#f7fcff" stroke="#071326" stroke-width="8" paint-order="stroke">POCKET</text>
    <text x="351" y="226" font-family="Arial Black, Impact, sans-serif" font-size="78" letter-spacing="1" fill="#1de6ef" stroke="#071326" stroke-width="9" paint-order="stroke">VECTOR</text>
  </g>
  <path d="M349 252 H730" stroke="#ff5f61" stroke-width="10" stroke-linecap="round"/>
  <path d="M674 73 L757 117 L727 129 L766 169 L746 186 L706 145 L693 175Z" fill="#ffc857" stroke="#020713" stroke-width="7"/>
  <g transform="translate(315 53) rotate(10) scale(0.72)">
    <path d="M-29 0 Q-15-23 0-24 Q16-23 30 0 Q16 23 0 24 Q-16 22-29 0Z" fill="#9e4328" stroke="#020713" stroke-width="6"/>
    <path d="M-20-8 Q0-20 21-7" fill="none" stroke="#df7653" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M-3-12 L-3 12 M-10-7 L4-7 M-10-1 L4-1 M-10 5 L4 5" stroke="#fff5da" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-22 0 L-15 0 M16 0 L23 0" stroke="#fff5da" stroke-width="4"/>
  </g>
</svg>
