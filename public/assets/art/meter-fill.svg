<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 58" role="img" aria-labelledby="title desc">
  <title id="title">TD Bonus meter fill</title>
  <desc id="desc">Cyan segmented fill that can be clipped to authoritative progress.</desc>
  <defs>
    <linearGradient id="cyanMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fbff"/>
      <stop offset="0.35" stop-color="#1de6ef"/>
      <stop offset="1" stop-color="#0782b9"/>
    </linearGradient>
    <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5a1ff"/>
      <stop offset="0.45" stop-color="#7d4dff"/>
      <stop offset="1" stop-color="#39257f"/>
    </linearGradient>
    <linearGradient id="coralMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb09f"/>
      <stop offset="0.42" stop-color="#ff5f61"/>
      <stop offset="1" stop-color="#a51f45"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36527b"/>
      <stop offset="0.55" stop-color="#102548"/>
      <stop offset="1" stop-color="#071326"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1de6ef" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1de6ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#020713" flood-opacity="0.65"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M22 7 H334 L354 29 L334 51 H22 L4 29Z" fill="url(#cyanMetal)" stroke="#b8fbff" stroke-width="4"/>
  <path d="M32 16 H316" stroke="#f7fcff" stroke-opacity="0.62" stroke-width="7" stroke-linecap="round"/>
  <path d="M25 42 H335" stroke="#7d4dff" stroke-opacity="0.55" stroke-width="6"/>
  <g stroke="#071326" stroke-opacity="0.32" stroke-width="3"><path d="M40 10 V48"/><path d="M66 10 V48"/><path d="M92 10 V48"/><path d="M118 10 V48"/><path d="M144 10 V48"/><path d="M170 10 V48"/><path d="M196 10 V48"/><path d="M222 10 V48"/><path d="M248 10 V48"/><path d="M274 10 V48"/><path d="M300 10 V48"/></g>
</svg>
