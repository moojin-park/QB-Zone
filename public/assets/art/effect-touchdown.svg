<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Touchdown effect</title>
  <desc id="desc">Amber starburst with a coral lightning bolt.</desc>
  <defs>
    <linearGradient id="cyanMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fbff"/>
      <stop offset="0.35" stop-color="#1de6ef"/>
      <stop offset="1" stop-color="#0782b9"/>
    </linearGradient>
    <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5a1ff"/>
      <stop offset="0.45" stop-color="#7d4dff"/>
      <stop offset="1" stop-color="#39257f"/>
    </linearGradient>
    <linearGradient id="coralMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb09f"/>
      <stop offset="0.42" stop-color="#ff5f61"/>
      <stop offset="1" stop-color="#a51f45"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36527b"/>
      <stop offset="0.55" stop-color="#102548"/>
      <stop offset="1" stop-color="#071326"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1de6ef" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1de6ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#020713" flood-opacity="0.65"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M127 8 L155 79 L231 57 L182 120 L247 160 L169 161 L159 241 L124 178 L57 224 L83 151 L8 126 L83 103 L46 32 L113 75Z" fill="#ffc857" stroke="#020713" stroke-width="8"/>
    <path d="M114 45 L169 45 L139 111 L182 111 L88 219 L113 137 L74 137Z" fill="#ff5f61" stroke="#020713" stroke-width="7"/>
  </g>
</svg>
